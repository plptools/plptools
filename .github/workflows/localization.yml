name: localization

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron:  '0 9 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:

    - name: Install dependencies and configure environment
      run: |
        sudo apt-get -y install libreadline-dev pkg-config gettext autopoint libfuse-dev libattr1-dev

    - name: Checkout source
      uses: actions/checkout@v6
      with:
        submodules: true

    - name: Check localizations
      run: ./build-aux/check-localization.sh
